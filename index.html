<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
>
<meta name="theme-color" content="#0f0f10">
<title>NeoAI | nathandev</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#0f0f10;
  --bg2:#151516;
  --bg3:#1b1b1d;
  --panel:#18181a;
  --panel2:#202023;
  --border:#303034;
  --text:#f4f4f5;
  --muted:#9b9ba3;
  --muted2:#6f6f77;
  --accent:#e9825b;
  --accent2:#b75dd6;
  --danger:#ef6464;
  --success:#63c174;
  --shadow:0 20px 60px rgba(0,0,0,.35);
}

body.light{
  --bg:#f7f7f8;
  --bg2:#ffffff;
  --bg3:#eeeeef;
  --panel:#ffffff;
  --panel2:#f1f1f2;
  --border:#dddddf;
  --text:#202023;
  --muted:#6c6c73;
  --muted2:#8b8b91;
  --shadow:0 15px 40px rgba(0,0,0,.10);
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.2s ease;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  color:inherit;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  overflow:hidden;
}

/* SIDEBAR */

.sidebar{
  width:285px;
  min-width:285px;
  height:100%;
  background:var(--bg2);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  z-index:50;
  transition:transform .25s ease;
}

.sidebar-top{
  padding:22px 18px 14px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:22px;
}

.brand-logo{
  width:42px;
  height:42px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  background:linear-gradient(135deg,#ed875c,#b75cd7);
  color:#fff;
  box-shadow:0 10px 30px rgba(211,107,137,.2);
}

.brand-text{
  font-size:20px;
  font-weight:800;
  letter-spacing:-.5px;
}

.new-chat{
  width:100%;
  height:48px;
  border:1px solid var(--border);
  border-radius:13px;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-weight:700;
  transition:.15s;
}

.new-chat:hover{
  background:var(--panel2);
}

.search-wrap{
  margin-top:13px;
  position:relative;
}

.search-wrap input{
  width:100%;
  height:45px;
  border-radius:12px;
  border:1px solid var(--border);
  outline:none;
  background:var(--panel);
  color:var(--text);
  padding:0 14px;
}

.search-wrap input::placeholder{
  color:var(--muted2);
}

.history-title{
  margin:22px 8px 9px;
  font-size:12px;
  color:var(--muted);
  font-weight:800;
  letter-spacing:.7px;
}

.chat-list{
  flex:1;
  overflow-y:auto;
  padding:0 10px 12px;
}

.chat-list::-webkit-scrollbar{
  width:5px;
}

.chat-list::-webkit-scrollbar-thumb{
  background:var(--border);
  border-radius:10px;
}

.chat-item{
  position:relative;
  display:flex;
  align-items:center;
  gap:7px;
  width:100%;
  min-height:45px;
  padding:0 5px 0 12px;
  border-radius:11px;
  margin-bottom:3px;
  background:transparent;
  transition:.15s;
}

.chat-item:hover{
  background:var(--panel2);
}

.chat-item.active{
  background:var(--panel2);
}

.chat-title{
  min-width:0;
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-align:left;
  color:var(--text);
  font-size:14px;
}

.chat-menu-btn{
  width:38px;
  height:38px;
  flex:none;
  border-radius:9px;
  background:transparent;
  color:var(--muted);
  font-size:20px;
}

.chat-menu-btn:hover{
  background:var(--bg3);
  color:var(--text);
}

.chat-menu{
  position:absolute;
  right:8px;
  top:42px;
  min-width:145px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:5px;
  box-shadow:var(--shadow);
  z-index:100;
  display:none;
}

.chat-menu.show{
  display:block;
}

.menu-option{
  width:100%;
  min-height:40px;
  padding:0 11px;
  border-radius:8px;
  background:transparent;
  display:flex;
  align-items:center;
  gap:9px;
  text-align:left;
  font-size:14px;
}

.menu-option:hover{
  background:var(--panel2);
}

.menu-option.delete{
  color:var(--danger);
}

.sidebar-bottom{
  border-top:1px solid var(--border);
  padding:12px;
}

.sidebar-action{
  width:100%;
  min-height:43px;
  border-radius:10px;
  background:transparent;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 12px;
  color:var(--muted);
  text-align:left;
}

.sidebar-action:hover{
  background:var(--panel2);
  color:var(--text);
}

/* MAIN */

.main{
  min-width:0;
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
}

.topbar{
  height:70px;
  min-height:70px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:rgba(15,15,16,.88);
  backdrop-filter:blur(16px);
  z-index:20;
}

body.light .topbar{
  background:rgba(255,255,255,.88);
}

.mobile-menu{
  display:none;
  position:absolute;
  left:14px;
  width:42px;
  height:42px;
  border-radius:10px;
  background:transparent;
  font-size:25px;
}

.mobile-menu:hover{
  background:var(--panel2);
}

.top-title{
  max-width:55%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-weight:700;
  font-size:16px;
}

.top-actions{
  position:absolute;
  right:15px;
  display:flex;
  gap:4px;
}

.top-btn{
  width:40px;
  height:40px;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  font-size:19px;
}

.top-btn:hover{
  background:var(--panel2);
  color:var(--text);
}

/* CONTENT */

.content{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:0 20px;
}

.content::-webkit-scrollbar{
  width:7px;
}

.content::-webkit-scrollbar-thumb{
  background:var(--border);
  border-radius:10px;
}

.messages{
  width:100%;
  max-width:850px;
  margin:0 auto;
  padding:35px 0 180px;
}

.welcome{
  min-height:calc(100dvh - 250px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  flex-direction:column;
  padding:30px 10px;
}

.welcome-logo{
  width:110px;
  height:110px;
  border-radius:31px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#eb8058,#b858d4);
  font-size:57px;
  color:white;
  box-shadow:
    0 20px 60px rgba(220,105,145,.18);
  margin-bottom:27px;
}

.welcome h1{
  font-size:42px;
  line-height:1.1;
  letter-spacing:-1.8px;
  margin-bottom:15px;
}

.welcome p{
  max-width:620px;
  color:var(--muted);
  line-height:1.7;
  font-size:17px;
}

.suggestions{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  width:100%;
  max-width:680px;
  margin-top:27px;
}

.suggestion{
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:14px;
  padding:15px;
  text-align:left;
  transition:.15s;
}

.suggestion:hover{
  background:var(--panel2);
  transform:translateY(-1px);
}

.suggestion-title{
  font-size:14px;
  font-weight:700;
  margin-bottom:5px;
}

.suggestion-text{
  color:var(--muted);
  font-size:13px;
}

/* MESSAGES */

.message{
  display:flex;
  flex-direction:column;
  margin-bottom:29px;
}

.message.user{
  align-items:flex-end;
}

.message.ai{
  align-items:flex-start;
}

.message-bubble{
  max-width:90%;
  line-height:1.65;
  font-size:15px;
}

.user .message-bubble{
  background:var(--panel2);
  border-radius:18px;
  padding:12px 16px;
  max-width:min(80%,650px);
}

.ai .message-bubble{
  max-width:100%;
}

.message-label{
  font-size:12px;
  color:var(--muted2);
  margin-bottom:6px;
  font-weight:700;
}

.message-tools{
  display:flex;
  gap:3px;
  margin-top:8px;
  opacity:.8;
}

.msg-tool{
  height:32px;
  min-width:32px;
  padding:0 8px;
  border-radius:8px;
  background:transparent;
  color:var(--muted);
}

.msg-tool:hover{
  background:var(--panel2);
  color:var(--text);
}

/* MARKDOWN */

.markdown{
  word-break:break-word;
}

.markdown p{
  margin:0 0 13px;
}

.markdown p:last-child{
  margin-bottom:0;
}

.markdown h1,
.markdown h2,
.markdown h3{
  margin:20px 0 10px;
  line-height:1.3;
}

.markdown h1{
  font-size:25px;
}

.markdown h2{
  font-size:21px;
}

.markdown h3{
  font-size:18px;
}

.markdown ul,
.markdown ol{
  margin:8px 0 14px 23px;
}

.markdown li{
  margin:5px 0;
}

.markdown blockquote{
  border-left:3px solid var(--accent);
  padding-left:14px;
  color:var(--muted);
  margin:12px 0;
}

.inline-code{
  background:var(--panel2);
  border:1px solid var(--border);
  padding:2px 6px;
  border-radius:5px;
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;
  font-size:.9em;
}

.code-wrap{
  margin:15px 0;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  background:#0b0b0d;
}

.code-head{
  height:37px;
  background:#17171a;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 9px 0 13px;
  color:#a5a5ac;
  font-size:12px;
}

.code-copy{
  background:transparent;
  color:#aaa;
  padding:6px 9px;
  border-radius:6px;
}

.code-copy:hover{
  background:#28282b;
  color:white;
}

pre{
  overflow-x:auto;
  padding:15px;
  margin:0;
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;
  font-size:13px;
  line-height:1.6;
  color:#e6e6e8;
}

pre::-webkit-scrollbar{
  height:5px;
}

pre::-webkit-scrollbar-thumb{
  background:#3a3a3e;
}

/* FILE */

.attachments{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:8px;
}

.file-chip{
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:9px;
  padding:7px 10px;
  color:var(--muted);
  font-size:12px;
}

/* COMPOSER */

.composer-area{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:18px 20px 18px;
  background:linear-gradient(
    to top,
    var(--bg) 60%,
    transparent
  );
  z-index:10;
}

.composer{
  width:100%;
  max-width:850px;
  margin:0 auto;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:20px;
  box-shadow:0 15px 45px rgba(0,0,0,.22);
  overflow:hidden;
}

.composer-main{
  display:flex;
  align-items:flex-end;
  padding:13px 13px 9px 17px;
  gap:8px;
}

#messageInput{
  flex:1;
  min-width:0;
  max-height:180px;
  min-height:44px;
  resize:none;
  outline:none;
  border:0;
  background:transparent;
  color:var(--text);
  line-height:1.5;
  padding:10px 2px;
}

#messageInput::placeholder{
  color:var(--muted2);
}

.attach-btn{
  width:42px;
  height:42px;
  flex:none;
  border-radius:11px;
  background:transparent;
  color:var(--muted);
  font-size:22px;
}

.attach-btn:hover{
  background:var(--panel2);
  color:var(--text);
}

.send-btn{
  width:48px;
  height:48px;
  flex:none;
  border-radius:13px;
  background:var(--accent);
  color:white;
  font-size:20px;
  transition:.15s;
}

.send-btn:hover{
  filter:brightness(1.08);
}

.send-btn.stop{
  background:var(--danger);
}

.composer-bottom{
  min-height:31px;
  padding:0 17px 9px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:var(--muted2);
  font-size:11px;
}

.status{
  display:flex;
  align-items:center;
  gap:6px;
}

.status-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--success);
}

.hidden{
  display:none !important;
}

/* OVERLAY */

.sidebar-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:40;
  display:none;
}

.sidebar-overlay.show{
  display:block;
}

/* CUSTOM MODAL */

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(5px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:500;
}

.modal-overlay.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:410px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:21px;
  box-shadow:var(--shadow);
}

.modal h3{
  margin-bottom:9px;
  font-size:19px;
}

.modal p{
  color:var(--muted);
  line-height:1.5;
  font-size:14px;
  margin-bottom:17px;
}

.modal input{
  width:100%;
  height:45px;
  background:var(--bg3);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:10px;
  padding:0 12px;
  outline:none;
  margin-bottom:16px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.modal-btn{
  min-height:40px;
  padding:0 14px;
  border-radius:9px;
  background:var(--panel2);
}

.modal-btn.primary{
  background:var(--accent);
  color:white;
}

.modal-btn.danger{
  background:var(--danger);
  color:white;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:100px;
  transform:translate(-50%,20px);
  background:#242427;
  color:white;
  padding:11px 16px;
  border-radius:10px;
  font-size:13px;
  box-shadow:var(--shadow);
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:900;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* LOADING */

.typing{
  display:flex;
  align-items:center;
  gap:5px;
  padding:8px 0;
}

.typing span{
  width:7px;
  height:7px;
  background:var(--muted);
  border-radius:50%;
  animation:bounce 1s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes bounce{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.5;
  }
  30%{
    transform:translateY(-5px);
    opacity:1;
  }
}

/* RESPONSIVE */

@media(max-width:800px){

  .sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    transform:translateX(-100%);
    width:290px;
    min-width:290px;
    box-shadow:var(--shadow);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .mobile-menu{
    display:block;
  }

  .topbar{
    height:62px;
    min-height:62px;
  }

  .top-title{
    max-width:45%;
    font-size:15px;
  }

  .top-actions{
    right:8px;
  }

  .top-btn{
    width:38px;
    height:38px;
  }

  .content{
    padding:0 13px;
  }

  .messages{
    padding-top:22px;
    padding-bottom:155px;
  }

  .welcome{
    min-height:calc(100dvh - 205px);
    padding:15px 5px;
  }

  .welcome-logo{
    width:82px;
    height:82px;
    border-radius:23px;
    font-size:43px;
    margin-bottom:21px;
  }

  .welcome h1{
    font-size:31px;
    letter-spacing:-1px;
  }

  .welcome p{
    font-size:14px;
    line-height:1.65;
  }

  .suggestions{
    grid-template-columns:1fr;
    margin-top:20px;
  }

  .suggestion{
    padding:13px;
  }

  .message-bubble{
    font-size:14px;
  }

  .user .message-bubble{
    max-width:88%;
  }

  .composer-area{
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  }

  .composer{
    border-radius:18px;
  }

  .composer-main{
    padding:8px 8px 5px 13px;
  }

  #messageInput{
    font-size:15px;
  }

  .attach-btn{
    width:38px;
    height:42px;
  }

  .send-btn{
    width:45px;
    height:45px;
  }

  .composer-bottom{
    padding-bottom:7px;
    padding-left:14px;
  }
}

@media(max-width:420px){

  .top-title{
    max-width:42%;
  }

  .welcome h1{
    font-size:28px;
  }

  .suggestions{
    gap:7px;
  }

  .suggestion-text{
    font-size:12px;
  }

  .message-tools{
    opacity:1;
  }
}

@media(min-width:801px){
  .sidebar-overlay{
    display:none !important;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-top">

      <div class="brand">
        <div class="brand-logo">✦</div>
        <div class="brand-text">NeoAI</div>
      </div>

      <button class="new-chat" id="newChatBtn">
        <span>＋</span>
        <span>New chat</span>
      </button>

      <div class="search-wrap">
        <input
          id="searchInput"
          type="search"
          placeholder="Search chats..."
          autocomplete="off"
        >
      </div>

      <div class="history-title">
        RECENT
      </div>

    </div>

    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-bottom">

      <button class="sidebar-action" id="themeBtn">
        <span id="themeIcon">◐</span>
        <span id="themeText">Dark mode</span>
      </button>

      <button class="sidebar-action" id="deleteAllBtn">
        <span>♻</span>
        <span>Delete all chats</span>
      </button>

    </div>

  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">

      <button class="mobile-menu" id="mobileMenuBtn">
        ☰
      </button>

      <div class="top-title" id="topTitle">
        NeoAI
      </div>

      <div class="top-actions">

        <button
          class="top-btn"
          id="topNewBtn"
          title="New chat"
        >
          ＋
        </button>

        <button
          class="top-btn"
          id="topThemeBtn"
          title="Dark mode"
        >
          ◐
        </button>

      </div>

    </header>

    <section class="content" id="content">

      <div class="messages" id="messages">

        <!-- WELCOME -->
        <div class="welcome" id="welcome">

          <div class="welcome-logo">
            ✦
          </div>

          <h1>
            How can I help you?
          </h1>

          <p>

/* =========================================================
   UTIL
   ========================================================= */

function uid(){
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2,8);
}

function escapeHTML(str){
  return String(str ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showToast(text){
  toast.textContent = text;
  toast.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer = setTimeout(()=>{
    toast.classList.remove("show");
  },2200);
}

function saveChats(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(chats)
  );
}

function loadChats(){

  try{
    const raw = localStorage.getItem(STORAGE_KEY);

    if(!raw){
      chats = [];
      return;
    }

    const parsed = JSON.parse(raw);

    if(Array.isArray(parsed)){
      chats = parsed;
    }else{
      chats = [];
    }

  }catch{
    chats = [];
  }
}

function createChat(){

  const chat = {
    id:uid(),
    title:"New chat",
    createdAt:Date.now(),
    updatedAt:Date.now(),
    messages:[]
  };

  chats.unshift(chat);
  activeChatId = chat.id;

  saveChats();
  renderSidebar();
  renderChat();

  closeSidebar();

  return chat;
}

function getActiveChat(){
  return chats.find(c => c.id === activeChatId);
}

   THEME
   ========================================================= */

function loadTheme(){

  const theme =
    localStorage.getItem(THEME_KEY) || "dark";

  document.body.classList.toggle(
    "light",
    theme === "light"
  );

  updateThemeUI();
}

function toggleTheme(){

  const light =
    document.body.classList.toggle("light");

  localStorage.setItem(
    THEME_KEY,
    light ? "light" : "dark"
  );

  updateThemeUI();
}

function updateThemeUI(){

  const light =
    document.body.classList.contains("light");

  themeIcon.textContent =
    light ? "☀" : "◐";

  themeText.textContent =
    light ? "Light mode" : "Dark mode";

  topThemeBtn.textContent =

}

/* =========================================================
   SIDEBAR RENDER
   ========================================================= */

function renderSidebar(){

  const search =
    searchInput.value.trim().toLowerCase();

  chatList.innerHTML = "";

  const filtered = chats.filter(chat => {

    if(!search) return true;

    return (
      chat.title.toLowerCase().includes(search)
    );
  });

  if(filtered.length === 0){

    const empty = document.createElement("div");

    empty.style.color = "var(--muted)";
    empty.style.padding = "18px 12px";
    empty.style.fontSize = "13px";
    empty.textContent =
      chats.length
        ? "Tidak ada chat yang cocok."
        : "Belum ada percakapan.";

    chatList.appendChild(empty);

    return;
  }

  filtered.forEach(chat => {

    const item =
      document.createElement("div");

    item.className =
      "chat-item" +
      (chat.id === activeChatId
        ? " active"
        : "");

    item.innerHTML = `
      <button
        class="chat-title"
        data-action="open"
        data-id="${chat.id}"
      >
        ${escapeHTML(chat.title)}
      </button>

      <button
        class="chat-menu-btn"
        data-action="menu"
        data-id="${chat.id}"
      >
        •••
      </button>

      <div
        class="chat-menu"
        data-menu="${chat.id}"
      >

        <button
          class="menu-option"
          data-action="rename"
          data-id="${chat.id}"
        >
          ✎
          <span>Rename</span>
        </button>

        <button
          class="menu-option delete"
          data-action="delete"
          data-id="${chat.id}"
        >
          🗑
          <span>Delete</span>
        </button>

      </div>
    `;

    chatList.appendChild(item);
  });
}

/* =========================================================
   SIDEBAR EVENTS
   ========================================================= */

chatList.addEventListener("click", e => {

  const target =
    e.target.closest("[data-action]");

  if(!target) return;

  const action =
    target.dataset.action;

  const id =
    target.dataset.id;

  if(action === "open"){
    openChat(id);
    return;
  }

  if(action === "menu"){

    e.stopPropagation();

    document
      .querySelectorAll(".chat-menu.show")
      .forEach(menu=>{
        if(menu.dataset.menu !== id){
          menu.classList.remove("show");
        }
      });

    const menu =
      document.querySelector(
        `[data-menu="${id}"]`
      );

    if(menu){
      menu.classList.toggle("show");
    }

    return;
  }

  if(action === "rename"){
    renameChat(id);
    return;
  }

  if(action === "delete"){
    deleteChat(id);
    return;
  }
});

document.addEventListener("click", e => {

  if(
    !e.target.closest(".chat-menu") &&
    !e.target.closest(".chat-menu-btn")
  ){

    document
      .querySelectorAll(".chat-menu.show")
      .forEach(menu=>{
        menu.classList.remove("show");
      });
  }
});

   OPEN CHAT
   ========================================================= */

function openChat(id){

  const exists =
    chats.some(c => c.id === id);

  if(!exists) return;

  activeChatId = id;

  saveChats();
  renderSidebar();
  renderChat();
  closeSidebar();
}

   NEW CHAT
   ========================================================= */

    return;

  createChat();

/* =========================================================
   RENAME
   ========================================================= */

function renameChat(id){

  const chat =
    chats.find(c => c.id === id);

  if(!chat) return;

  document
    .querySelectorAll(".chat-menu.show")
    .forEach(menu=>{
      menu.classList.remove("show");
    });

  openModal({
    title:"Rename chat",
    text:"Masukkan nama baru untuk percakapan ini.",
    input:true,
    inputValue:chat.title,
    confirmText:"Simpan",
    callback:(value)=>{

      const name =
        String(value || "").trim();

      if(!name){
        showToast("Nama chat tidak boleh kosong.");
        return;
      }

      chat.title = name;
      chat.updatedAt = Date.now();

      saveChats();
      renderSidebar();
      renderChat();

      showToast("Nama chat berhasil diubah.");
    }
  });
}

/* =========================================================
   DELETE CHAT
   ========================================================= */

function deleteChat(id){

  const chat =
    chats.find(c => c.id === id);

  if(!chat) return;

  document
    .querySelectorAll(".chat-menu.show")
    .forEach(menu=>{
      menu.classList.remove("show");
    });

  openModal({
    title:"Hapus percakapan?",
    text:
      `Percakapan "${chat.title}" akan dihapus dari perangkat ini.`,
    confirmText:"Hapus",
    danger:true,
    callback:()=>{

      chats =
        chats.filter(c => c.id !== id);

      if(activeChatId === id){

        if(chats.length){
          activeChatId = chats[0].id;
        }else{
          activeChatId = null;
        }
      }

      saveChats();

      if(!activeChatId){
        createChat();
      }else{
        renderSidebar();
        renderChat();
      }

      showToast("Percakapan berhasil dihapus.");
    }
  });
}

  if(chats.length === 0){
    showToast("Belum ada chat untuk dihapus.");

    title:"Hapus semua chat?",
    text:
      `Semua ${chats.length} percakapan akan dihapus. Tindakan ini tidak dapat dibatalkan.`,
    confirmText:"Hapus semua",

    callback:()=>{

      chats = [];
      activeChatId = null;

      saveChats();

    "hidden",

      options.inputValue || "";

    setTimeout(()=>{
      modalInput.focus();
      modalInput.select();
    },50);
  }else{
    modalInput.value = "";
  }

  modalCallback =
    options.callback || null;

  modalOverlay.classList.add("show");
}

function closeModal(){

  modalOverlay.classList.remove("show");
  modalCallback = null;
  modalInput.value = "";
}

);

function createMessageElement(message,index){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " +
    (message.role === "user"
      ? "user"
      : "ai");

  const label =
    document.createElement("div");

  label.className =
    "message-label";

  label.textContent =
    message.role === "user"
      ? "You"
      : "NeoAI";

  const bubble =
    document.createElement("div");

  bubble.className =
    "message-bubble";

  if(message.role === "user"){

    let text =
      escapeHTML(message.content);

    if(message.files?.length){

      const files =
        message.files
          .map(file =>
            `<div class="file-chip">
              📄 ${escapeHTML(file.name)}
            </div>`
          )
          .join("");

      bubble.innerHTML = `
        <div class="attachments">
          ${files}

        ${text
          .replace(/\n/g,"<br>")}

    }else{

      bubble.innerHTML =
        text.replace(/\n/g,"<br>");
    }

  }else{

    bubble.innerHTML =
      markdownToHTML(
        message.content
      );
  }

  wrapper.appendChild(label);
  wrapper.appendChild(bubble);

  /* TOOLS */

  const tools =
    document.createElement("div");

  tools.className =

  if(message.role === "ai"){

      document.createElement("button");

    copy.className = "msg-tool";
    copy.textContent = "⧉";
    copy.title = "Copy";

    copy.onclick = ()=>{
      copyText(
        message.content
      );
    };

    tools.appendChild(copy);

    const regen =
      document.createElement("button");

    regen.className = "msg-tool";
    regen.textContent = "↻";
    regen.title = "Regenerate";

    regen.onclick = ()=>{
      regenerate(index);
    };

    tools.appendChild(regen);
  }

  wrapper.appendChild(tools);

  return wrapper;
}

/* =========================================================
   MARKDOWN
   ========================================================= */

function markdownToHTML(input){

  if(!input) return "";

  let text =
    String(input)
      .replace(/\r\n/g,"\n")
      .replace(/\r/g,"\n");

  const codeBlocks = [];

  text = text.replace(
    /```([a-zA-Z0-9_+#.-]*)\n?([\s\S]*?)```/g,
    (_,lang,code)=>{

      const id =
        "CODE_" + codeBlocks.length;

      codeBlocks.push({
        id,
        lang:lang || "code",
        code:code.replace(/\n$/,"")
      });

      return `\n@@${id}@@\n`;
    }
  );

  let html =
    escapeHTML(text);

  html =
    html.replace(
      /^### (.*)$/gm,
      "<h3>$1</h3>"
    );

  html =
    html.replace(
      /^## (.*)$/gm,
      "<h2>$1</h2>"
    );

  html =
    html.replace(
      /^# (.*)$/gm,
      "<h1>$1</h1>"
    );

  html =
    html.replace(
      /^> (.*)$/gm,
      "<blockquote>$1</blockquote>"
    );

  html =
    html.replace(
      /^\- (.*)$/gm,
      "<li>$1</li>"
    );

  html =
    html.replace(
      /(<li>.*<\/li>)(?:\n|$)/g,
      "$1"
    );

  html =
    html.replace(
      /(<li>.*<\/li>)+/g,
      match => `<ul>${match}</ul>`
    );

  html =
    html.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );

  html =
    html.replace(
      /\*(.*?)\*/g,
      "<em>$1</em>"
    );

  html =
    html.replace(
      /`([^`\n]+)`/g,
      '<span class="inline-code">$1</span>'
    );

  html =
    html.replace(
      /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      "$1"
    );

  const blocks =
    html.split(/\n{2,}/);

  html =
    blocks.map(block => {

      if(
        /^<h[1-3]>/.test(block) ||
        /^<blockquote>/.test(block) ||
        /^<ul>/.test(block) ||
        /^@@CODE_/.test(block)
      ){
        return block;
      }

      return block
        ? `<p>${block.replace(/\n/g,"<br>")}</p>`
        : "";

    }).join("");

  codeBlocks.forEach(block=>{

    const safeCode =
      escapeHTML(block.code);

    const codeHTML = `
      <div class="code-wrap">

        <div class="code-head">

          <span>
            ${escapeHTML(block.lang)}
          </span>

          <button
            class="code-copy"
            data-code="${encodeURIComponent(block.code)}"
          >
            Copy
          </button>

        </div>

        <pre><code>${safeCode}</code></pre>

      </div>
    `;

    html =
      html.replace(
        `@@${block.id}@@`,
        codeHTML
      );
  });

  return html;
}

/* =========================================================
   COPY
   ========================================================= */

async function copyText(text){

  try{

    await navigator.clipboard.writeText(
      text
    );

    showToast("Berhasil disalin.");

  }catch{

    const textarea =
      document.createElement("textarea");

    textarea.value = text;

    document.body.appendChild(
      textarea
    );

    textarea.select();

    document.execCommand("copy");

    textarea.remove();

    showToast("Berhasil disalin.");
  }
}

/* =========================================================
   INPUT
   ========================================================= */

function autoResize(){

  messageInput.style.height =
    "auto";

  messageInput.style.height =
    Math.min(
      messageInput.scrollHeight,
      180
    ) + "px";
}

messageInput.addEventListener(
  "input",
  autoResize
);

messageInput.addEventListener(
  "keydown",
  e=>{

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      sendMessage();
    }
  }
);

/* =========================================================
   FILE UPLOAD
   ========================================================= */

attachBtn.addEventListener(
  "click",
  ()=>{
    fileInput.click();
  }
);

fileInput.addEventListener(
  "change",
  async ()=>{

    const files =
      Array.from(fileInput.files || []);

    if(!files.length) return;

    selectedFiles = [];

    for(const file of files){

      try{

        const text =
          await file.text();

        selectedFiles.push({
          name:file.name,
          size:file.size,
          type:file.type,
          text:text.slice(0,30000)
        });

      }catch{

        selectedFiles.push({
          name:file.name,
          size:file.size,
          type:file.type,
          text:"File tidak dapat dibaca."
        });
      }
    }

    showToast(
      `${selectedFiles.length} file dipilih.`
    );

    fileInput.value = "";
  }
);

/* =========================================================
   BUILD PROMPT WITH FILES
   ========================================================= */

function buildPrompt(message){

  if(!selectedFiles.length){
    return message;
  }

  let result =
    message +
    "\n\n--- FILE TERLAMPIR ---\n";

  selectedFiles.forEach(file=>{

    result +=
      `\nNama file: ${file.name}\n` +
      `Isi file:\n` +
      file.text +
      "\n---\n";
  });

  return result;
}

/* =========================================================
   SEND
   ========================================================= */

sendBtn.addEventListener(
  "click",
  ()=>{
    if(isGenerating){
      stopGeneration();
    }else{
      sendMessage();
    }
  }
);

async function sendMessage(){

  if(isGenerating){
    return;
  }

  const text =
    messageInput.value.trim();

  if(!text && !selectedFiles.length){
    return;
  }

  let chat =
    getActiveChat();

  if(!chat){

    chat =
      createChat();
  }

  const userText =
    text || "Tolong analisis file yang saya lampirkan.";

  const apiPrompt =
    buildPrompt(userText);

  const filesForMessage =
    selectedFiles.map(file=>({
      name:file.name,
      size:file.size,
      type:file.type
    }));

  /* USER MESSAGE */

  chat.messages.push({
    role:"user",
    content:userText,
    files:filesForMessage,
    createdAt:Date.now()
  });

  /* TITLE */

  if(
    chat.title === "New chat" ||
    chat.title.trim() === ""
  ){

    chat.title =
      generateTitle(userText);
  }

  chat.updatedAt =
    Date.now();

  saveChats();

  messageInput.value = "";
  messageInput.style.height = "auto";

  selectedFiles = [];

  renderSidebar();
  renderChat();

  /* AI */

  await generateAI(chat,apiPrompt);
}

/* =========================================================
   TITLE
   ========================================================= */

function generateTitle(text){

  let title =
    text
      .replace(/\s+/g," ")
      .trim();

  if(title.length > 35){
    title =
      title.slice(0,35) + "...";
  }

  return title || "New chat";
}

/* =========================================================
   GENERATE
   ========================================================= */

async function generateAI(chat,prompt){

  isGenerating = true;

  controller =
    new AbortController();

  updateGeneratingUI(true);

  /* temporary typing */

  const typing =
    document.createElement("div");

  typing.className =
    "message ai";

  typing.id =
    "typingMessage";

  typing.innerHTML = `
    <div class="message-label">
      NeoAI
    </div>

    <div class="message-bubble">

      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>
  `;

  messagesEl.appendChild(typing);

  scrollBottom();

  try{

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            message:prompt
          }),
          signal:controller.signal
        }
      );

    const raw =
      await response.text();

    let data;

    try{
      data = JSON.parse(raw);
    }catch{
      throw new Error(
        "Server mengembalikan respons yang bukan JSON."
      );
    }

    if(!response.ok){

      throw new Error(
        data?.error ||
        data?.details ||
        `Server error ${response.status}`
      );
    }

    if(!data.success){

      throw new Error(
        data?.error ||
        "API tidak mengembalikan jawaban."
      );
    }

    const answer =
      data.message;

    if(!answer){

      throw new Error(
        "Jawaban AI kosong."
      );
    }

    removeTyping();

    chat.messages.push({
      role:"assistant",
      content:String(answer),
      createdAt:Date.now()
    });

    chat.updatedAt =
      Date.now();

    saveChats();

    renderSidebar();
    renderChat();

  }catch(error){

    removeTyping();

    if(error.name === "AbortError"){

      showToast(
        "Generasi dihentikan."
      );

      return;
    }

    console.error(
      "NeoAI:",
      error
    );

    chat.messages.push({
      role:"assistant",
      content:
        `⚠️ **Gagal terhubung ke API.**\n\n` +
        `${error.message || "Unknown error"}\n\n` +
        `Pastikan deployment Vercel sudah terbaru dan file **api/chat.js** berada di folder yang benar.`,
      createdAt:Date.now(),
      error:true
    });

    saveChats();

    renderSidebar();
    renderChat();

    showToast(
      "Gagal menghubungkan ke API."
    );

  }finally{

    isGenerating = false;
    controller = null;

    updateGeneratingUI(false);
  }
}

/* =========================================================
   STOP
   ========================================================= */

function stopGeneration(){

  if(controller){

    controller.abort();

    controller = null;
  }
}

function updateGeneratingUI(active){

  if(active){

    sendBtn.classList.add("stop");
    sendBtn.textContent = "■";
    sendBtn.title = "Stop generation";

    statusText.textContent =
      "NeoAI sedang berpikir...";

  }else{

    sendBtn.classList.remove("stop");
    sendBtn.textContent = "↑";
    sendBtn.title = "Send";

    statusText.textContent =
      "NeoAI siap membantu";
  }
}

/* =========================================================
   TYPING
   ========================================================= */

function removeTyping(){

  const typing =
    document.getElementById(
      "typingMessage"
    );

  if(typing){
    typing.remove();
  }
}

/* =========================================================
   SCROLL
   ========================================================= */

function scrollBottom(){

  requestAnimationFrame(()=>{
    content.scrollTop =
      content.scrollHeight;
  });
}

/* =========================================================
   REGENERATE
   ========================================================= */

async function regenerate(index){

  if(isGenerating){
    showToast("NeoAI masih menghasilkan jawaban.");
    return;
  }

  const chat =
    getActiveChat();

  if(!chat) return;

  const assistant =
    chat.messages[index];

  if(
    !assistant ||
    assistant.role !== "assistant"
  ){
    return;
  }

  let userIndex =
    index - 1;

  while(
    userIndex >= 0 &&
    chat.messages[userIndex].role !== "user"
  ){
    userIndex--;
  }

  if(userIndex < 0){
    showToast("Pesan sebelumnya tidak ditemukan.");
    return;
  }

  const prompt =
    chat.messages[userIndex].content;

  chat.messages.splice(index,1);

  saveChats();
  renderChat();

  await generateAI(
    chat,
    prompt
  );
}

/* =========================================================
   THEME EVENTS
   ========================================================= */

themeBtn.addEventListener(
  "click",
  toggleTheme
);

topThemeBtn.addEventListener(
  "click",
  toggleTheme
);

/* =========================================================
   INITIALIZE
   ========================================================= */

function initialize(){

  loadTheme();
  loadChats();

  if(chats.length === 0){

    createChat();

  }else{

    activeChatId =
      chats[0].id;

    renderSidebar();
    renderChat();
  }
}

initialize();

</script>
